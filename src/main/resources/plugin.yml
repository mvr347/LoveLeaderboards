name: LoveLeaderboards
version: '${project.version}'
main: dev.lovelace.loveleaderboards.LoveLeaderboards
api-version: '26.2'
authors: [ "Antigravity" ]
description: Advanced leaderboards plugin for Love ecosystem.

depend: [LoveCore, LoveEssential]
softdepend: [PlaceholderAPI, LoveHunt, LoveClans, Citizens, Vesuvio]

commands:
  leaderboard:
    description: Open the main leaderboard GUI
    aliases: [ lb, top, loveleaderboards, топ ]
    permission: loveleaderboards.use
    permission-message: ""
  loveleaderboardsadmin:
    description: Admin commands for LoveLeaderboards
    permission: loveleaderboards.admin
    permission-message: ""
  leaderboardadmin:
    description: "[Устарело] Используйте /loveleaderboardsadmin"
    aliases: [ lba, lbadmin ]
    permission: loveleaderboards.admin
    permission-message: ""

permissions:
  loveleaderboards.use:
    description: Allows using basic leaderboard commands
    default: true
  loveleaderboards.admin:
    description: Allows using admin commands
    default: op