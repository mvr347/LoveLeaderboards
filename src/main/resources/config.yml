# ====== ИНТЕГРАЦИИ ======

integrations:
  placeholder-api:
    enabled: true
    cache-time: 30  # секунды
  vesuvio:
    enabled: true
    hide-suspects: true

# ====== ПРОИЗВОДИТЕЛЬНОСТЬ ======

performance:
  cache-ttl: 30000  # миллисекунды (30 сек)
  cache-max-size: 256
  batch-update-interval: 2000  # 2 сек (когда писать batch в БД)
  batch-update-size: 1000  # макс элементов в одном батче

# ====== СБРОС МЕСЯЧНЫХ ТОПОВ ======

monthly-reset:
  enabled: true
  day-of-month: 1  # 1-го числа
  hour: 0  # В полночь (00:00)
  minute: 0

# ====== НАГРАДЫ =====

rewards:
  enabled: true
  # 2026-10-19: победителю не в сети команды give/title отвечают «No player was found», а месяц уже отмечен
  # выплаченным, так что награда терялась. Теперь она хранится и выдаётся при входе игрока; 60 дней хватает
  # на длинный отпуск и не копит записи тех, кто ушёл насовсем.
  pending-keep-days: 60
  run-at:
    day-of-month: 1
    hour: 0
    minute: 5  # через 5 минут после сброса
  
  categories:
    kills:
      rank-1:
        display-name: '&6Первое место по убийствам'
        commands:
          - 'give %player% diamond 64'
          - 'broadcast &6%player% &fпобедил в топе убийств!'
      rank-2-3:
        display-name: '&eВторое-третье место'
        commands:
          - 'give %player% emerald 32'
      rank-4-10:
        display-name: '&7Топ 10'
        commands:
          - 'give %player% gold_ingot 16'
      rank-11-50:
        display-name: '&7Топ 50'
        commands:
          - 'give %player% gold_nugget 8'
    
    bounty-completed:
      rank-1:
        display-name: '&6Король Охотников'
        commands:
          - 'give %player% diamond 48'
          - 'title %player% times 10 70 20'
          # 2026-10-19: с 1.21.5 /title принимает только JSON-компонент, '&'-коды дают ошибку синтаксиса
          # и обрывали выдачу остальных команд.
          - 'title %player% title {"text":"Мастер Охоты","color":"gold","bold":true}'
    
    clan-power:
      rank-1:
        display-name: '&6Мощнейший клан'
        commands:
          - 'broadcast &6Клан %clan% стал мощнейшим! Мощь: %score%'

# ====== GUI И КНОПКИ ======

gui:
  main:
    size: 54
    title: '&6Таблица Лидеров'
    
  alltime:
    size: 54
    title: '&6Топ за всё время'
    
  monthly:
    size: 54
    title: '&6Топ за %month% %year%'
    
  player-stats:
    # 2026-10-07: больше не используется. Размер считается по числу категорий (27/36/54),
    # чтобы сетка не залезала на боковые стенки рабочей зоны (gui_gen, пункт 8).
    size: 27
    title: '&6Моя Статистика'
    
  comparison:
    size: 27
    title: '&6Сравнение'

  category-select:
    title: '&6Выбор категории'

  # Настройки слота 0 (Профиль игрока / Клана)
  # 2026-10-19: иконка ⭐ убрана по стандарту оформления GUI; клик идёт отдельной строкой после разделителя,
  # ЛКМ зелёным. Серверы с уже созданным config.yml сохраняют старый текст (defaults не перезаписываются),
  # этот блок при обновлении нужно поправить вручную.
  slot-0:
    player:
      head-b64: ""  # Оставьте пустым для отображения собственного скина игрока, или вставьте Base64
      name: "&e%player_name%"
      lore:
        - "&7Категория: &f%category_name%"
        - "&7Период: %time_period%"
        - ""
        - "&7Ваше место: &e#%rank%"
        - "&7%unit%: &a%score%"
        - ""
        - "<green>✓ <gray>Это вы"
        - "<dark_gray><st>─────────────────────</st>"
        - "<green>ЛКМ <dark_gray>— <gray>посмотреть статистику"
  # Настройки свободных мест в лидерборде
  # 2026-10-19: место без игрока описано как пустое состояние: подзаголовок и «Что делать» вместо строки «Статус».
  empty-slot:
    name: "<gray>Свободное место <dark_gray>| <white>#%rank%"
    lore:
      - "<dark_gray>Пусто"
      - ""
      - "<dark_gray>▪ <gray>Что делать:"
      - "  <gray>Наберите очки в этой категории,"
      - "  <gray>чтобы занять это место в топе."

# Все Base64 текстуры голов (для кнопок, категорий и спец-слотов)
# перенесены и структурированы в отдельном файле: heads.yml

# ====== СООБЩЕНИЯ ======

# 2026-10-14: no-clan и comparison-self (отказы при клике в меню), а также hall-of-fame.interaction.shift-click-message
# показываются как событийные уведомления через LoveNotify из LoveCore: по умолчанию в экшнбаре, а в чат
# попадают, если текст длиннее лимита LoveCore или экшнбар выключен у игрока. Раньше они уходили в чат
# напрямую. Держите эти тексты короткими. Остальные сообщения (права, команды админа, rewards-given
# для всего сервера) остаются обычными сообщениями чата. Без LoveCore плагин шлёт их напрямую: и в экшнбар, и в чат.
messages:
  no-permission: '&cУ вас нет прав на эту команду!'
  player-not-found: '&cИгрок &f%player% &cне найден!'
  no-stats: '&cЭтот игрок ещё не в топе!'
  comparison-self: '&cНельзя сравнивать с самим собой!'
  no-clan: '&cУ вас ещё нет клана!'
  rewards-given: '&aВознаграждения выданы за &f%month%!'
  monthly-reset: '&aМесячный топ сброшен!'

# ====== ЗАЛ СЛАВЫ (HALL OF FAME) ======
hall-of-fame:
  enabled: true
  
  hologram:
    height-offset: 2.3
    shadowed: true
    see-through: false
    billboard: "CENTER"
    empty-player-name: "Свободно"
    empty-score-text: "0"
    lines:
      - "&e&l★ ЗАЛ СЛАВЫ ★"
      - "&fКатегория: &a%category_name%"
      - "&fПериод: &6%time_period%"
      - "&fЛидер #%position%: &b%player_name%"
      - "&fОчки: &e%score%"
      # 2026-10-19: подсказки оформлены как строки кликов меню (Shift жёлтым, ПКМ золотым, тире тёмно-серым).
      # Голограмма выводит текст через legacy-коды (TextUtil.colorize), поэтому здесь остаются & и MiniMessage не нужен.
      - "&eShift &8+ &6ПКМ &8— &7сменить период"
      - "&6ПКМ &8— &7открыть меню"

  periods:
    alltime: "За всё время"
    monthly: "За месяц"
    weekly: "За неделю"
    yearly: "За год"

  npc:
    update-skin: true
    fallback-skin: "Steve"
    empty-name: "&7[Свободно]"
    name-format: "&e%player_name%"

  interaction:
    shift-click-message: "&a[Зал Славы] &fПериод отображения переключен на: &e%period%"
    shift-click-sound: "BLOCK_NOTE_BLOCK_PLING"
    shift-click-sound-volume: 1.0
    shift-click-sound-pitch: 1.5
    normal-click-sound: "UI_BUTTON_CLICK"
    normal-click-sound-volume: 1.0
    normal-click-sound-pitch: 1.0
