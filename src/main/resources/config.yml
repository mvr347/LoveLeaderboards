# ====== ИНТЕГРАЦИИ ======

integrations:
  placeholder-api:
    enabled: true
    cache-time: 30  # секунды

# ====== ПРОИЗВОДИТЕЛЬНОСТЬ ======

performance:
  cache-ttl: 30000  # миллисекунды (30 сек)
  cache-max-size: 256
  batch-update-interval: 2000  # 2 сек (когда писать batch в БД)
  batch-update-size: 1000  # макс элементов в одном батче

# ====== СБРОС МЕСЯЧНЫХ ТОПОВ ======

monthly-reset:
  enabled: true
  day-of-month: 1  # 1-го числа
  hour: 0  # В полночь (00:00)
  minute: 0

# ====== НАГРАДЫ =====

rewards:
  enabled: true
  run-at:
    day-of-month: 1
    hour: 0
    minute: 5  # через 5 минут после сброса
  
  categories:
    kills:
      rank-1:
        display-name: '&6🥇 Первое место по убийствам'
        commands:
          - 'give %player% diamond 64'
          - 'broadcast &6%player% &fпобедил в топе убийств!'
      rank-2-3:
        display-name: '&e🥈 Второе-третье место'
        commands:
          - 'give %player% emerald 32'
      rank-4-10:
        display-name: '&7🥉 Топ 10'
        commands:
          - 'give %player% gold_ingot 16'
      rank-11-50:
        display-name: '&7📊 Топ 50'
        commands:
          - 'give %player% gold_nugget 8'
    
    bounty-completed:
      rank-1:
        display-name: '&6🏆 Король Охотников'
        commands:
          - 'give %player% diamond 48'
          - 'title %player% times 10 70 20'
          - 'title %player% title &6&lМастер Охоты'
    
    clan-power:
      rank-1:
        display-name: '&6👑 Мощнейший клан'
        commands:
          - 'broadcast &6Клан %clan% стал мощнейшим! Мощь: %score%'

# ====== GUI И КНОПКИ ======

gui:
  main:
    size: 54
    title: '&6⭐ Таблица Лидеров'
    
  alltime:
    size: 54
    title: '&6⭐ Топ Всё время'
    
  monthly:
    size: 54
    title: '&6⭐ Топ за %month% %year%'
    
  player-stats:
    size: 27
    title: '&6📊 Моя Статистика'
    
  comparison:
    size: 27
    title: '&6⚔️ Сравнение'

  # Настройки слота 0 (Профиль игрока / Клана)
  slot-0:
    player:
      head-b64: ""  # Оставьте пустым для отображения собственного скина игрока, или вставьте Base64
      name: "&e%player_name%"
      lore:
        - ""
        - "&7Категория: &f%category_name%"
        - "&7Период: %time_period%"
        - ""
        - "&7Ваше место: &e#%rank%"
        - "&7%unit%: &a%score%"
        - ""
        - "&a⭐ Это вы!"
        - "&a▶ Нажмите, чтобы открыть статистику"
  # Настройки свободных мест в лидерборде
  empty-slot:
    name: "&7#%rank% &8Свободное место"
    lore:
      - ""
      - "&7Позиция: &f#%rank%"
      - "&7Статус: &8Пусто"

# Все Base64 текстуры голов (для кнопок, категорий и спец-слотов)
# перенесены и структурированы в отдельном файле: heads.yml

# ====== СООБЩЕНИЯ ======

messages:
  no-permission: '&cУ вас нет прав на эту команду!'
  player-not-found: '&cИгрок &f%player% &cне найден!'
  no-stats: '&cЭтот игрок ещё не в топе!'
  comparison-self: '&cНельзя сравнивать с самим собой!'
  no-clan: '&cУ вас ещё нет клана!'
  rewards-given: '&aВознаграждения выданы за &f%month%!'
  monthly-reset: '&aМесячный топ сброшен!'

# ====== ЗАЛ СЛАВЫ (HALL OF FAME) ======
hall-of-fame:
  enabled: true
  
  hologram:
    height-offset: 2.3
    shadowed: true
    see-through: false
    billboard: "CENTER"
    empty-player-name: "Свободно"
    empty-score-text: "0"
    lines:
      - "&e&l★ ЗАЛ СЛАВЫ ★"
      - "&fКатегория: &a%category_name%"
      - "&fПериод: &6%time_period%"
      - "&fЛидер #%position%: &b%player_name%"
      - "&fОчки: &e%score%"
      - "&7(Shift + ПКМ — сменить период)"
      - "&7(ПКМ — открыть меню)"

  periods:
    alltime: "За всё время"
    monthly: "За месяц"
    weekly: "За неделю"
    yearly: "За год"

  npc:
    update-skin: true
    fallback-skin: "Steve"
    empty-name: "&7[Свободно]"
    name-format: "&e%player_name%"

  interaction:
    shift-click-message: "&a[Зал Славы] &fПериод отображения переключен на: &e%period%"
    shift-click-sound: "BLOCK_NOTE_BLOCK_PLING"
    shift-click-sound-volume: 1.0
    shift-click-sound-pitch: 1.5
    normal-click-sound: "UI_BUTTON_CLICK"
    normal-click-sound-volume: 1.0
    normal-click-sound-pitch: 1.0
