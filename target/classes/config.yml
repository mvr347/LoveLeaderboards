# ====== ОСНОВНЫЕ НАСТРОЙКИ ======

plugin:
  version: 2.0
  language: "ru"

# ====== КАТЕГОРИИ ЛИДЕРБОРДОВ ======
# Каждая категория может быть отслеживаема за всё время и/или месяц

categories:
  kills:
    display-name: '&6⚔️  Убийства'
    description: 'Количество убийств игроков'
    enabled: true
    sort-order: 1
    time-period: 'both'  # 'alltime', 'monthly', или 'both'
    
  bounty-completed:
    display-name: '&6💰 Бонусы'
    description: 'Выполненные бонусы от LoveHunt'
    enabled: true
    sort-order: 2
    time-period: 'both'
    integration: 'LoveHunt'  # Автоматически обновляется при BountyCompletedEvent
    
  clan-power:
    display-name: '&6👑 Мощь Клана'
    description: 'Общая мощь клана'
    enabled: true
    sort-order: 3
    time-period: 'alltime'  # Только всё время, не месячный топ
    integration: 'LoveClans'  # Автоматически синхронизируется каждый час

# ====== ИНТЕГРАЦИИ ======

integrations:
  love-hunt:
    enabled: true
    # Слушать BountyCompletedEvent и обновлять 'bounty-completed' категорию
  
  love-clans:
    enabled: true
    sync-interval: 3600  # секунды (1 час)
    # Получать мощь кланов и обновлять 'clan-power' категорию

  placeholder-api:
    enabled: true
    cache-time: 30  # секунды

# ====== ПРОИЗВОДИТЕЛЬНОСТЬ ======

performance:
  cache-ttl: 30000  # миллисекунды (30 сек)
  cache-max-size: 256
  batch-update-interval: 2000  # 2 сек (когда писать batch в БД)
  batch-update-size: 1000  # макс элементов в одном батче

# ====== СБРОС МЕСЯЧНЫХ ТОПОВ ======
# Автоматический сброс в конце месяца

monthly-reset:
  enabled: true
  day-of-month: 1  # 1-го числа
  hour: 0  # В полночь (00:00)
  minute: 0

# ====== НАГРАДЫ =====
# Выдаются только игрокам в конце месяца (команда или таск)
# Кланы НЕ получают награды

rewards:
  enabled: true
  run-at:
    day-of-month: 1
    hour: 0
    minute: 5  # через 5 минут после сброса
  
  categories:
    kills:
      rank-1:
        display-name: '&6🥇 Первое место по убийствам'
        commands:
          - 'give %player% diamond 64'
          - 'broadcast &6%player% &fпобедил в топе убийств!'
      rank-2-3:
        display-name: '&e🥈 Второе-третье место'
        commands:
          - 'give %player% emerald 32'
      rank-4-10:
        display-name: '&7🥉 Топ 10'
        commands:
          - 'give %player% gold_ingot 16'
      rank-11-50:
        display-name: '&7📊 Топ 50'
        commands:
          - 'give %player% gold_nugget 8'
    
    bounty-completed:
      rank-1:
        display-name: '&6🏆 Король Охотников'
        commands:
          - 'give %player% diamond 48'
          - 'title %player% times 10 70 20'
          - 'title %player% title &6&lМастер Охоты'
    
    clan-power:
      # Кланы НЕ получают награды (по ТЗ)
      # Но можно добавить команды для всех членов клана:
      rank-1:
        display-name: '&6👑 Мощнейший клан'
        commands:
          - 'broadcast &6Клан %clan% стал мощнейшим! Мощь: %score%'

# ====== GUI ======

gui:
  main:
    size: 54
    title: '&6⭐ Таблица Лидеров'
    
  alltime:
    size: 54
    title: '&6⭐ Топ Всё время'
    
  monthly:
    size: 54
    title: '&6⭐ Топ за %month% %year%'
    
  player-stats:
    size: 27
    title: '&6📊 Моя Статистика'
    
  comparison:
    size: 27
    title: '&6⚔️ Сравнение'

# ====== СООБЩЕНИЯ (lang.yml или здесь) ======

messages:
  no-permission: '&cУ вас нет прав на эту команду!'
  player-not-found: '&cИгрок &f%player% &cнё найден!'
  no-stats: '&cЭтот игрок ещё не в топе!'
  comparison-self: '&cНельзя сравнивать с самим собой!'
  rewards-given: '&aВознаграждения выданы за &f%month%!'
  monthly-reset: '&aМесячный топ сброшен!'

# ====== ЗАЛ СЛАВЫ (HALL OF FAME) ======
hall-of-fame:
  enabled: true
  
  # Настройки визуальной голограммы над NPC
  hologram:
    height-offset: 2.3
    shadowed: true
    see-through: false
    billboard: "CENTER"  # CENTER, FIXED, VERTICAL, HORIZONTAL
    empty-player-name: "Свободно"
    empty-score-text: "0"
    lines:
      - "&e&l★ ЗАЛ СЛАВЫ ★"
      - "&fКатегория: &a%category_name%"
      - "&fПериод: &6%time_period%"
      - "&fЛидер #%position%: &b%player_name%"
      - "&fОчки: &e%score%"
      - "&7(Shift + ПКМ — сменить период)"
      - "&7(ПКМ — открыть меню)"

  # Названия временных периодов
  periods:
    alltime: "За всё время"
    monthly: "За месяц"
    weekly: "За неделю"
    yearly: "За год"

  # Настройки Citizens NPC и скинов
  npc:
    update-skin: true
    fallback-skin: "Steve"
    empty-name: "&7[Свободно]"
    name-format: "&e%player_name%"

  # Настройки взаимодействия, звуков и сообщений
  interaction:
    shift-click-message: "&a[Зал Славы] &fПериод отображения переключен на: &e%period%"
    shift-click-sound: "BLOCK_NOTE_BLOCK_PLING"
    shift-click-sound-volume: 1.0
    shift-click-sound-pitch: 1.5
    normal-click-sound: "UI_BUTTON_CLICK"
    normal-click-sound-volume: 1.0
    normal-click-sound-pitch: 1.0
